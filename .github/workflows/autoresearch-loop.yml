name: BoundForge autonomous research loop
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c51certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/autoresearch/requirements.txt
      - name: Build credential-free proposal image
        run: docker build -t boundforge-research-worker boundforge/autoresearch
      - name: One command owns all research decisions
        run: python -m boundforge.autoresearch.run --out boundforge/autoresearch/output --sandbox docker --upstream
      - name: Verify resume and artifact integrity
        run: python -m boundforge.autoresearch.run --out boundforge/autoresearch/output --sandbox docker --upstream --resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-loop-output
          path: boundforge/autoresearch/output/
          retention-days: 30
