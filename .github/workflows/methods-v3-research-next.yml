name: BoundForge collision prior art, model critique and memory
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused Exa prior-art calls
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python -m boundforge.methods_v3.focused_review --out boundforge/methods_v3/output/research-next
      - name: Complete hosted-memory ingestion and recall
        env:
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m boundforge.methods_v3.continue_memory --run 43749410835 --out boundforge/methods_v3/output/research-next
      - run: python -m pip install tinker==0.39.0 Jinja2==3.1.6
      - name: Bounded Tinker mechanism critique
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -m boundforge.methods_v3.critique --out boundforge/methods_v3/output/research-next
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-research-next
          path: boundforge/methods_v3/output/research-next/
          retention-days: 30
