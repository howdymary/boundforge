name: BoundForge methods v3 measured research memory
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Store and recall measured negative findings
        env:
          PAST_API_KEY: ${{ secrets.PAST_API_KEY }}
        run: python -m boundforge.methods_v3.memory --out boundforge/methods_v3/output/memory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-memory
          path: boundforge/methods_v3/output/memory/
          retention-days: 30
