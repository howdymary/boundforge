name: BoundForge weighted-budget structural pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  weighted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 mpmath==1.3.0 pytest
      - name: Check arithmetic, carry-free model and weighted gradients
        run: python -m pytest -q -p no:cacheprovider boundforge/portfolio/test_portfolio.py
      - name: Reproduce finite C3e witness with primary and two own checkers
        run: python -u boundforge/portfolio/reproduce_masked.py
      - name: Bounded genuinely different weighted-digit budget search
        run: python -u boundforge/portfolio/weighted_search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-weighted-budget
          path: |
            boundforge/portfolio/reproduction/
            boundforge/portfolio/weighted/
          retention-days: 30
