name: BoundForge autonomous loop with Exa and Tinker
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-autonomous-provider-ledger
  cancel-in-progress: false
jobs:
  c51certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/autoresearch/requirements.txt
      - name: Verify math, controller, budget, and checkpoint controls
        run: python -m pytest -q -p no:cacheprovider boundforge/portfolio/test_portfolio.py boundforge/portfolio/test_c1b.py boundforge/portfolio/test_c1d.py boundforge/portfolio/test_translation.py boundforge/portfolio/test_active.py boundforge/portfolio/test_c51.py boundforge/autoresearch/test_autoresearch.py
      - name: Install bounded provider client
        run: python -m pip install tinker==0.39.0
      - name: Build credential-free proposal image
        run: docker build -t boundforge-research-worker boundforge/autoresearch
      - name: Source-gated model-assisted research loop
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          HF_HOME: boundforge/autoresearch/provider-cache
        run: python -m boundforge.autoresearch.run --out boundforge/autoresearch/output --sandbox docker --upstream --providers
      - name: Validate result and preserve exact environment
        run: |
          python -c 'import json; r=json.load(open("boundforge/autoresearch/output/report.json")); assert r["status"]=="certified_historical_replay"'
          python -m pip freeze > boundforge/autoresearch/output/dependency-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomous-provider-loop-output
          path: boundforge/autoresearch/output/
          retention-days: 30
