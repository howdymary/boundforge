name: BoundForge record portfolio free pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3
      - name: Inventory all constants and current open claims
        run: python boundforge/portfolio/audit.py
      - name: Bounded new-mask and tilt search
        run: python -u boundforge/portfolio/masked_search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-portfolio-pilot
          path: |
            boundforge/portfolio/audit/
            boundforge/portfolio/pilot/
          retention-days: 30
