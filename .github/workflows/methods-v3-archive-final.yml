name: BoundForge retain final owned campaign evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retain weighted production, reasoning proposal and strengthened verification
        run: python -m boundforge.methods_v3.archive_owned --artifact 14177767352:weighted-production-events --artifact 14177507943:reasoned-alternative --artifact 14177882544:exact-events-verified-all-writes
