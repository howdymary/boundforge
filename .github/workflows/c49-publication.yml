name: C49 preserve results and independently certify
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wait for bounded remote campaign completion
        run: |
          gh run watch 43680750855 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
          gh run watch 43681053247 --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
      - run: python -m pip install -r boundforge/requirements.txt matplotlib playwright
      - name: Regression and adversarial exact-checker tests
        run: |
          python boundforge/migration_check.py
          python -m pytest -q -p no:cacheprovider boundforge/test_core.py boundforge/research_v2/test_v2.py boundforge/c49/test_c49.py
          python boundforge/verify.py boundforge/results/best.json --baseline boundforge/certificates/incumbent.json
          python boundforge/verify_independent.py boundforge/results/best.json boundforge/certificates/incumbent.json
      - name: Fresh C49 certification and evidence preservation on main
        run: python -u boundforge/c49/publish_results.py
      - run: python -m playwright install --with-deps chromium
      - name: Inspect actual desktop/mobile replay and witness download
        run: python boundforge/c49/ui_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c49-final-certification-and-ui
          path: |
            boundforge/c49/results/certification.json
            boundforge/c49/results/resource-summary.json
            boundforge/c49/ui-checks/
          retention-days: 30
