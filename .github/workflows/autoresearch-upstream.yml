name: BoundForge third-party unchanged checker replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c51certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mpmath==1.3.0
      - run: python -u boundforge/autoresearch/upstream_verify.py boundforge/portfolio/results/2026-11-15/c51-certified/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-published-checker
          path: boundforge/autoresearch/upstream-output/
          retention-days: 30
