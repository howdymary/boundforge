name: BoundForge methods v3 bounded model hypotheses
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  hypotheses:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tinker==0.39.0 Jinja2==3.1.6
      - name: Generate bounded hypotheses
        env:
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -m boundforge.methods_v3.hypotheses --out boundforge/methods_v3/output/hypotheses
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-hypotheses
          path: boundforge/methods_v3/output/hypotheses/
          retention-days: 30
