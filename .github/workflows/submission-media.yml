name: BoundForge submission demo assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c51certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mpmath==1.3.0 -r boundforge/submission/requirements-media.txt
      - name: Install remote media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render actual-data viewer and120-second video
        run: python -m boundforge.submission.render_demo
      - name: Remote browser smoke and visual checks
        run: python -m boundforge.submission.render_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundforge-submission-media
          path: boundforge/submission/demo/
          retention-days: 30
