name: BoundForge exact support-signature pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 python-flint==0.8.0 mpmath==1.3.0 scipy==1.15.2
      - run: python -m pytest -q -p no:cacheprovider boundforge/methods_v4/test_masks.py boundforge/methods_v4/test_jets.py boundforge/methods_v4/test_adaptive_log.py
      - run: python -m boundforge.methods_v4.oracle_pilot --out boundforge/methods_v4/output/oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v4-oracle
          path: boundforge/methods_v4/output/oracle/
          retention-days: 30
          if-no-files-found: error
