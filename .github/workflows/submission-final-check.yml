name: BoundForge submission final verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider boundforge/test_core.py boundforge/research_v2/test_v2.py boundforge/c49/test_c49.py
      - run: python boundforge/migration_check.py
  submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r boundforge/autoresearch/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider boundforge/portfolio/test_portfolio.py boundforge/portfolio/test_c1b.py boundforge/portfolio/test_c1d.py boundforge/portfolio/test_translation.py boundforge/portfolio/test_active.py boundforge/portfolio/test_c51.py boundforge/autoresearch/test_autoresearch.py
      - run: docker build -t boundforge-research-worker boundforge/autoresearch
      - name: Reproduce complete autonomous loop with independent published checker
        run: python -m boundforge.autoresearch.run --out boundforge/autoresearch/final-check --sandbox docker --upstream
      - name: Recheck checkpoint and immutable artifacts
        run: python -m boundforge.autoresearch.run --out boundforge/autoresearch/final-check --sandbox docker --upstream --resume
      - name: Compile project sources
        run: python -m compileall -q boundforge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-final-verification
          path: boundforge/autoresearch/final-check/
          retention-days: 30
