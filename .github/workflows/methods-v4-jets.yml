name: BoundForge entropy boundary diagnosis pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 python-flint==0.8.0 mpmath==1.3.0
      - name: Test exact entropy jets and independent finite checks
        run: python -m pytest -q -p no:cacheprovider boundforge/methods_v4/test_jets.py
      - name: Discriminating formal-versus-finite pilot
        run: python -m boundforge.methods_v4.pilot --out boundforge/methods_v4/output/jets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v4-jets
          path: boundforge/methods_v4/output/jets/
          retention-days: 30
          if-no-files-found: error
