name: BoundForge exact continuum translation certification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Check two algorithms against literal cell-intersection integrals
        run: python -m pytest -q -p no:cacheprovider boundforge/portfolio/test_translation.py
      - name: Verify all real shifts of baseline and new rational translation
        run: python -u boundforge/portfolio/translation_certify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-exact-translation
          path: boundforge/portfolio/translation_certification/
          retention-days: 30
