name: BoundForge recover completed batch evidence and verify
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 sympy==1.14.0 mpmath==1.3.0
      - name: Test algebra, failure scopes and existing experimental controls
        run: python -m pytest -q -p no:cacheprovider boundforge/methods_v3/test_methods.py boundforge/methods_v3/collision/test_collision.py boundforge/methods_v3/collision/test_batch.py
      - name: Recover summaries and reverify retained witnesses
        run: python -m boundforge.methods_v3.collision.batch_report --artifact 14176424974 --out boundforge/methods_v3/output/batch-recovered
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-batch-recovered
          path: boundforge/methods_v3/output/batch-recovered/
          retention-days: 30
          if-no-files-found: error
