name: BoundForge revised hypotheses from sources and measured failures
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tinker==0.39.0 jinja2==3.1.6
      - name: Source-informed revised hypotheses without balance probes
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
        run: python -m boundforge.methods_v3.next_hypotheses --out boundforge/methods_v3/output/next-hypotheses
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-next-hypotheses
          path: boundforge/methods_v3/output/next-hypotheses/
          retention-days: 30
