name: C49 exploratory constraint search
on:
  workflow_dispatch:
    inputs:
      evaluation_run:
        description: Completed frozen evaluation ledger
        required: true
        type: string
      model_run:
        description: Optional model study accounting ledger
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.evaluation_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: c49-evaluation
          path: boundforge/c49/evaluation
      - uses: actions/download-artifact@v4
        if: inputs.model_run != ''
        with:
          run-id: ${{ inputs.model_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: c49-model-study
          path: boundforge/c49/model_study
      - run: python -m pip install modal
      - name: Run preregistered new-family CP-SAT pilots
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -u boundforge/c49/production.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c49-production
          path: boundforge/c49/production/
          retention-days: 30
