name: BoundForge free continuous-translation diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3
      - run: python -u boundforge/portfolio/translation_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-translation-probe
          path: boundforge/portfolio/translation/
          retention-days: 30
