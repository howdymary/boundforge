name: BoundForge independent event and memory verification
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Completed exact-event artifact ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable checker source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 sympy==1.14.0 mpmath==1.3.0
      - name: Test all new algebra and failure scopes
        run: python -m pytest -q -p no:cacheprovider boundforge/methods_v3/test_methods.py boundforge/methods_v3/collision/test_collision.py boundforge/methods_v3/collision/test_batch.py boundforge/methods_v3/collision/test_pencil.py
      - name: Independently replay every retained family certificate and witness
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: python -m boundforge.methods_v3.collision.verify_pencil --artifact "$ARTIFACT_ID" --out boundforge/methods_v3/output/pencil-verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-pencil-verified
          path: boundforge/methods_v3/output/pencil-verified/
          retention-days: 30
          if-no-files-found: error
