name: BoundForge conventional solver counterfactual
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install modal==1.5.1 python-flint==0.8.0 mpmath==1.3.0
      - name: Matched conventional proposals on isolated remote CPUs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m boundforge.methods_v4.legacy_modal --out boundforge/methods_v4/output/legacy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v4-legacy
          path: boundforge/methods_v4/output/legacy/
          retention-days: 30
          if-no-files-found: error
