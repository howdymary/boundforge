name: BoundForge methods v3 literature review
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - name: Bounded literature calls
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python -m boundforge.methods_v3.review --out boundforge/methods_v3/output/review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-review
          path: boundforge/methods_v3/output/review/
          retention-days: 30
