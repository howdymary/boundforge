name: BoundForge portfolio independent replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c59:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 pytest mpmath==1.3.0
      - run: python -m pytest -q -p no:cacheprovider boundforge/portfolio/test_portfolio.py boundforge/portfolio/test_c1b.py boundforge/portfolio/test_c1d.py boundforge/portfolio/test_translation.py boundforge/portfolio/test_active.py boundforge/portfolio/test_c51.py
      - name: Replay exact saved witness through both algorithms
        run: |
          mkdir -p boundforge/portfolio/final-replay
          python -I boundforge/portfolio/c1b_translate_exact.py boundforge/portfolio/results/2026-11-15/translation-optimum/candidate.json > boundforge/portfolio/final-replay/prefix.json
          python -I boundforge/portfolio/c1b_translate_sweep.py boundforge/portfolio/results/2026-11-15/translation-optimum/candidate.json > boundforge/portfolio/final-replay/jumps.json
          python -c 'import json,pathlib; p=pathlib.Path("boundforge/portfolio/final-replay"); a=json.loads((p/"prefix.json").read_text()); b=json.loads((p/"jumps.json").read_text()); assert a["valid"] and b["valid"] and a["score"]==b["score"]; print(a["score"])'
      - name: Preserve protected hashes
        run: |
          echo '3c5cd73bf3d50eea098d3253e46e9e5ea9812ec3c2fa2711ea16b349f586ef30  boundforge/verify.py' | sha256sum -c -
          echo '49e1cbbc9d287a227d8f790b2f7a678972a88f53d3c2e88592f6c1424dda0774  boundforge/verify_independent.py' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record-final-independent-replay
          path: boundforge/portfolio/final-replay/
          retention-days: 30
