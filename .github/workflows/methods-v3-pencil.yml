name: BoundForge exact event and scoped memory development
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boundforge-paid-providers
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch immutable source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/tarball/$SOURCE_SHA" | tar -xz --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 sympy==1.14.0 mpmath==1.3.0 modal==1.6.4
      - name: Check exact rank, repair theorem, embeddings and independent arithmetic
        run: python -m pytest -q -p no:cacheprovider boundforge/methods_v3/collision/test_collision.py boundforge/methods_v3/collision/test_batch.py boundforge/methods_v3/collision/test_pencil.py
      - name: Bounded Modal development experiments
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m boundforge.methods_v3.collision.pencil_modal --out boundforge/methods_v3/output/pencil
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: methods-v3-pencil
          path: boundforge/methods_v3/output/pencil/
          retention-days: 30
          if-no-files-found: error
